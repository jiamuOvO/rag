# Copy this file to config.yaml. Never put an API key in this file.
paths:
  data_dir: "F:/RAG/Li_Jia/data"
  var_dir: "F:/RAG/Li_Jia/var"

ocr:
  enabled: true
  min_page_chars: 80

chunking:
  target_tokens: 384
  overlap_tokens: 64

chat:
  provider: openai_compatible
  base_url: null
  model: "Qwen3.6-35B-A3B"
  timeout_seconds: 60
  # The secret is read from this environment variable, never from YAML.
  api_key_env: RAG_CHAT_API_KEY

embedding:
  provider: openai_compatible
  # The embedding service may use a different URL from the chat service.
  base_url: null
  model: "Qwen3-Embedding-0.6B"
  timeout_seconds: 60
  batch_size: 10
  api_key_env: RAG_EMBEDDING_API_KEY

reranker:
  # disabled by default; lexical_coverage is an explainable offline baseline.
  provider: disabled

structured_extraction:
  # Conservative evidence-bound rule prototype; failures never block text RAG.
  enabled: false

observability:
  debug: false
