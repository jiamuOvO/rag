# Copy to config.yaml for local use. Never store API keys in this file.
paths:
  data_dir: "./data"
  var_dir: "./var"

ocr:
  enabled: true
  min_page_chars: 80

chunking:
  target_tokens: 384
  overlap_tokens: 64

chat:
  provider: extractive
  base_url: null
  model: null
  timeout_seconds: 60
  api_key_env: RAG_CHAT_API_KEY

embedding:
  provider: disabled
  base_url: null
  model: null
  timeout_seconds: 60
  batch_size: 10
  api_key_env: RAG_EMBEDDING_API_KEY

reranker:
  provider: disabled

structured_extraction:
  enabled: false

observability:
  debug: false

# Multi-scope settings are environment-driven in production:
# RAG_DEFAULT_TENANT_ID=default
# RAG_TEMP_DOCUMENT_TTL_HOURS=24
# RAG_CONVERSATION_CONTEXT_MESSAGES=6
# RAG_ENV=production
# RAG_DEV_AUTH_ENABLED=0
