[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "li-jia-rag"
version = "0.2.0"
description = "Observable research-paper RAG baseline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pymupdf==1.25.5",
  "rapidocr-onnxruntime==1.4.4",
  "numpy==2.2.5",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "reportlab==4.4.0",
]

[project.scripts]
li-jia-rag = "rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
