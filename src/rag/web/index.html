<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperTrace 科研证据</title><link rel="stylesheet" href="/assets/style.css?v=14-20260911"></head>
<body><header class="topbar"><div><span class="eyebrow">RESEARCH EVIDENCE</span><strong>PaperTrace</strong></div><div class="top-actions"><span id="scopeSummary">官方知识库</span><span id="health" class="pill">检查服务…</span><button id="adminToggle">管理员</button></div></header>
<main id="userWorkspace" class="workspace">
<aside class="sidebar"><button id="newConversation" class="primary wide">＋ 新建对话</button><h2>历史会话</h2><div id="conversationList" class="nav-list empty">登录后显示历史会话</div><h2>资料范围</h2><label class="check"><input id="useOfficial" type="checkbox" checked> 平台官方知识库</label><div id="collectionList" class="nav-list"></div><button id="manageCollections" class="text-button">管理我的研究库</button><div id="collectionEditor" class="editor hidden"><input id="collectionName" placeholder="研究库名称"><button id="createCollection">创建</button></div></aside>
<section class="chat"><div class="chat-head"><div><h1 id="conversationTitle">新对话</h1><div id="scopeTags" class="tags"></div></div><button id="renameConversation">修改标题</button></div><div id="messages" class="messages"><div class="empty-state"><h2>从可信论文证据开始</h2><p>选择检索范围，提出一个科研问题。每条引用都能在右侧回查。</p></div></div><div id="temporaryFiles" class="temporary-files"></div><div class="composer"><textarea id="question" placeholder="例如：木糖制糠醛的最高收率和反应条件是什么？"></textarea><div class="composer-actions"><label class="upload">＋ 临时 PDF<input id="tempUpload" type="file" accept="application/pdf"></label><span id="composerState" class="muted"></span><button id="askBtn" class="primary">发送</button></div></div></section>
<aside id="evidencePanel" class="evidence-panel"><div class="panel-head"><h2>证据</h2><button id="closeEvidence">×</button></div><div id="evidenceDetail" class="empty-state"><p>点击回答中的引用，在这里查看来源、页码、章节和原文片段。</p></div></aside></main>
<main id="adminWorkspace" class="admin hidden"><div class="admin-head"><div><span class="eyebrow">ADMINISTRATION</span><h1>管理员工作台</h1></div><button id="backToChat">返回问答</button></div><div id="adminLogin" class="login-box"><input id="password" type="password" placeholder="管理员密码"><button id="loginBtn" class="primary">登录</button><span id="loginState"></span></div><nav class="admin-tabs"><button data-admin="documents" class="active">文档处理</button><button data-admin="retrieval">检索测试</button><button data-admin="logs">运行日志</button></nav>
<section id="admin-documents" class="admin-view active"><div class="section-head"><div><h2>官方库文档</h2><p>检查处理状态、页面/OCR 与 chunks，失败任务可安全重试。</p></div><label class="upload">上传官方 PDF<input id="officialUpload" type="file" accept="application/pdf"></label></div><div id="paperList" class="table-wrap empty">登录后加载</div><div id="documentInspect"></div></section>
<section id="admin-retrieval" class="admin-view"><h2>检索测试</h2><div class="test-query"><input id="testQuestion" placeholder="输入测试问题"><input id="testTopK" type="number" value="8" min="1" max="50"><button id="retrieveBtn" class="primary">仅检索</button></div><div id="retrievalResults" class="result-list"></div></section>
<section id="admin-logs" class="admin-view"><div class="section-head"><div><h2>运行日志</h2><p>近期任务和查询阶段；点击查看详情，无需复制 ID。</p></div><button id="refreshRuns">刷新</button></div><div id="runsList" class="table-wrap"></div><div id="runDetail"></div></section></main>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="modalClose" class="modal-close">×</button><div id="modalBody"></div></div></div><div id="toast" role="status"></div><script src="/assets/app.js?v=14-20260911"></script></body></html>
